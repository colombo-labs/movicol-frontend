server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — never fallback to index.html
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — only for non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
