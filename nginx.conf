resolver 8.8.8.8 8.8.4.4 valid=30s;

server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    set $backend "https://movicol-backend-develop.up.railway.app";

    # API reverse proxy — all backend routes
    location /auth {
        proxy_pass $backend;
        proxy_set_header Host movicol-backend-develop.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_cookie_path / /;
    }

    location /route-prediction {
        proxy_pass $backend;
        proxy_set_header Host movicol-backend-develop.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location /predictions {
        proxy_pass $backend;
        proxy_set_header Host movicol-backend-develop.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location /graph {
        proxy_pass $backend;
        proxy_set_header Host movicol-backend-develop.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location /chat {
        proxy_pass $backend;
        proxy_set_header Host movicol-backend-develop.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location /admin {
        proxy_pass $backend;
        proxy_set_header Host movicol-backend-develop.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location /health {
        proxy_pass $backend;
        proxy_set_header Host movicol-backend-develop.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location /notifications {
        proxy_pass $backend;
        proxy_set_header Host movicol-backend-develop.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location /user {
        proxy_pass $backend;
        proxy_set_header Host movicol-backend-develop.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location /saved-routes {
        proxy_pass $backend;
        proxy_set_header Host movicol-backend-develop.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location /preferences {
        proxy_pass $backend;
        proxy_set_header Host movicol-backend-develop.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location /stations {
        proxy_pass $backend;
        proxy_set_header Host movicol-backend-develop.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    location /routes {
        proxy_pass $backend;
        proxy_set_header Host movicol-backend-develop.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_ssl_server_name on;
    }

    # WebSocket support
    location /socket.io {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host movicol-backend-develop.up.railway.app;
        proxy_ssl_server_name on;
    }

    # SPA fallback — must be last
    location / {
        try_files $uri $uri/ /index.html;
    }
}
